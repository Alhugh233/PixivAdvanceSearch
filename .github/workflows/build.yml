name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Caches Gradle User Home, wrapper distribution and the local build cache.
          # Enhanced caching is free for public repositories and deduplicates entries.
          # Do not enable setup-java's `cache: gradle` at the same time.
          cache-provider: enhanced

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Compose 1.13 / Material3 1.5 require compileSdk 37.1.
          packages: 'platforms;android-37.1 build-tools;37.0.0'

      - name: Verify Android SDK platform
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -d "$SDK_ROOT/platforms/android-37.1"
          ls -la "$SDK_ROOT/platforms"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p jks
          echo "$KEYSTORE_BASE64" | base64 -d > jks/.jks

      - name: Build release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Prepare APK
        run: |
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          cp "$APK_PATH" PixivAdvanceSearch.apk
          ls -lh PixivAdvanceSearch.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          # v7 supports non-zipped single-file artifacts.
          # The artifact name becomes the file name; `name` is ignored.
          path: PixivAdvanceSearch.apk
          archive: false
          if-no-files-found: error
